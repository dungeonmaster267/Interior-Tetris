<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interior Tetris: Client Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f0e8;
            --ink: #1a1a2e;
            --gold: #c9a84c;
            --gold-lt: #f0d98a;
            --success: #2d6a4f;
            --danger: #c1121f;
            --card: #fffdf7;
            --border: #e0d8c8;
            --accent: #4a3728;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(201,168,76,0.06) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(74,55,40,0.06) 0%, transparent 50%);
        }

        /* ── HEADER ── */
        .header {
            text-align: center;
            padding: 32px 20px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--card);
            position: relative;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4em;
            color: var(--ink);
            letter-spacing: -1px;
        }

        .header h1 span { color: var(--gold); }

        .header p {
            color: #888;
            font-size: 0.9em;
            margin-top: 4px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* ── CLIENT SELECTOR ── */
        .client-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .client-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 16px 20px;
            cursor: pointer;
            width: 240px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .client-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--client-color, var(--gold));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .client-card.active {
            border-color: var(--client-color, var(--gold));
            background: #fff;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            transform: translateY(-3px);
        }

        .client-card.active::before { opacity: 1; }

        .client-avatar {
            font-size: 2.2em;
            margin-bottom: 6px;
        }

        .client-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.05em;
            font-weight: 700;
            color: var(--ink);
        }

        .client-budget-tag {
            display: inline-block;
            background: var(--client-color, var(--gold));
            color: white;
            font-size: 0.72em;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            margin: 6px 0;
            letter-spacing: 0.04em;
        }

        .client-story {
            font-size: 0.76em;
            color: #888;
            line-height: 1.5;
            margin-top: 6px;
        }

        /* ── MAIN LAYOUT ── */
        .game-layout {
            display: grid;
            grid-template-columns: 320px 1fr 280px;
            gap: 20px;
            max-width: 1100px;
            width: 95%;
            margin: 0 auto 50px;
        }

        .panel {
            background: var(--card);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            max-height: 76vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .panel-title {
            font-family: 'Playfair Display', serif;
            font-size: 1em;
            color: var(--ink);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            letter-spacing: 0.02em;
        }

        .category-box {
            margin-bottom: 18px;
        }

        .cat-name {
            font-size: 0.7em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #aaa;
            display: block;
            margin-bottom: 8px;
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .opt-btn {
            border: 1.5px solid var(--border);
            background: var(--bg);
            padding: 10px 4px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.72em;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            color: var(--ink);
            line-height: 1.4;
        }

        .opt-btn:hover { border-color: #bbb; background: white; }

        .opt-btn.active {
            border-color: var(--active-color, var(--gold));
            background: white;
            color: var(--ink);
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            transform: scale(1.04);
        }

        .opt-btn.active .cost-tag {
            color: var(--active-color, var(--gold));
        }

        .cost-tag { font-weight: 700; display: block; margin-top: 2px; }

        /* ── TOWER ── */
        .stack-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
        }

        .tower-header {
            font-family: 'Playfair Display', serif;
            font-size: 0.9em;
            color: var(--ink);
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 0.03em;
        }

        .glass-tower {
            width: 170px;
            height: 500px;
            border: 3px solid var(--ink);
            border-top: none;
            border-radius: 0 0 12px 12px;
            background: rgba(255,253,247,0.9);
            position: relative;
            display: flex;
            flex-direction: column-reverse;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }

        .budget-line {
            position: absolute;
            width: 100%;
            border-top: 2px dashed var(--danger);
            z-index: 10;
            transition: bottom 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .budget-label {
            position: absolute;
            right: -90px;
            top: -12px;
            color: var(--danger);
            font-weight: 700;
            font-size: 0.72em;
            white-space: nowrap;
            letter-spacing: 0.04em;
        }

        .block {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.68em;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.25);
            transition: height 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 0.03em;
        }

        .status-badge {
            margin-top: 14px;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.82em;
            letter-spacing: 0.04em;
            transition: all 0.3s;
        }

        .status-badge.ok { background: #d8f3dc; color: var(--success); }
        .status-badge.over { background: #ffe0e0; color: var(--danger); }

        /* ── VISUALIZER ── */
        .visualizer {
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .stat-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin-bottom: 14px;
        }

        .stat-card {
            text-align: center;
            padding: 14px 8px;
            border-radius: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
        }

        .big-num {
            font-family: 'Playfair Display', serif;
            font-size: 1.6em;
            font-weight: 700;
            display: block;
            color: var(--ink);
        }

        .stat-label {
            font-size: 0.62em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #aaa;
            margin-top: 2px;
        }

        #home-svg {
            width: 100%;
            height: 180px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fafafa;
            margin: 4px 0 12px;
        }

        .optimize-btn {
            width: 100%;
            padding: 14px;
            background: var(--ink);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            font-size: 0.9em;
            letter-spacing: 0.04em;
            transition: all 0.2s;
            margin-top: 6px;
        }

        .optimize-btn:hover {
            background: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* ── CELEBRATION ── */
        .celebration-overlay {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            text-align: center;
            pointer-events: none;
            display: none;
        }

        .celebration-overlay h2 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5em;
            color: var(--gold);
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .celebration-overlay p {
            color: white;
            font-size: 1.1em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* ── BRIEF BOX ── */
        .brief-box {
            background: linear-gradient(135deg, var(--client-bg, #fff9ee), var(--card));
            border: 1px solid var(--client-color, var(--gold));
            border-left: 4px solid var(--client-color, var(--gold));
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 0.78em;
            color: #666;
            line-height: 1.6;
        }

        .brief-box strong {
            display: block;
            color: var(--ink);
            font-size: 1.05em;
            margin-bottom: 4px;
            font-family: 'Playfair Display', serif;
        }

        /* scrollbar */
        .panel::-webkit-scrollbar { width: 4px; }
        .panel::-webkit-scrollbar-track { background: transparent; }
        .panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        @media (max-width: 900px) {
            .game-layout { grid-template-columns: 1fr; }
            .stack-container { order: -1; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Interior <span>Tetris</span></h1>
    <p>Design within budget · Three clients · One goal</p>
</div>

<!-- Client Selector -->
<div class="client-bar" id="client-bar"></div>

<div class="game-layout">
    <div class="panel" id="controls">
        <div class="brief-box" id="brief-box">
            <strong>Select a client above to begin</strong>
            Choose your client to load their brief and budget.
        </div>
        <div class="panel-title">📐 Material Selections</div>
    </div>

    <div class="stack-container">
        <div class="tower-header" id="tower-header">Budget Tower</div>
        <div class="glass-tower" id="tower">
            <div class="budget-line" id="budget-line">
                <span class="budget-label" id="budget-label">10L LIMIT</span>
            </div>
        </div>
        <div class="status-badge ok" id="status">✅ Within Budget</div>
    </div>

    <div class="visualizer">
        <div class="stat-row">
            <div class="stat-card">
                <span class="big-num" id="score-val">0</span>
                <div class="stat-label">Aesthetic Score</div>
            </div>
            <div class="stat-card">
                <span class="big-num" id="cost-val">₹0L</span>
                <div class="stat-label">Total Spent</div>
            </div>
        </div>

        <svg id="home-svg" viewBox="0 0 200 120">
            <rect x="10" y="10" width="180" height="100" fill="#eee" id="v-wall"/>
            <rect x="10" y="100" width="180" height="10" fill="#999" id="v-floor"/>
            <rect x="40" y="30" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1" id="v-window"/>
            <rect x="110" y="40" width="60" height="60" fill="#8d6e63" id="v-furniture"/>
            <rect x="10" y="10" width="180" height="10" fill="#ddd" id="v-ceiling"/>
        </svg>

        <button class="optimize-btn" onclick="autoOptimize()">✨ Auto-Optimize for This Client</button>
    </div>
</div>

<div class="celebration-overlay" id="celeb">
    <h2>PERFECT FIT!</h2>
    <p id="celeb-msg">Optimal solution found!</p>
</div>

<script>
    // ── CLIENT DATA ──────────────────────────────────────────────
    const clients = [
        {
            id: 'priya',
            name: 'Priya & Rahul',
            emoji: '👰',
            budget: 6.0,
            color: '#e07b54',
            bgColor: '#fff4f0',
            budgetLabel: '6L',
            tagline: '₹6 Lakh Budget',
            story: 'Newlyweds setting up their first 1BHK in Pune. Practical, cheerful, and stretching every rupee — they want a cozy home without the debt.',
            brief: 'Keep it functional & fresh. Prioritise kitchen and flooring. Avoid luxury splurges.',
        },
        {
            id: 'vinod',
            name: 'Vinod Sharma',
            emoji: '👔',
            budget: 10.0,
            color: '#4a6fa5',
            bgColor: '#f0f4ff',
            budgetLabel: '10L',
            tagline: '₹10 Lakh Budget',
            story: 'A mid-career professional upgrading his 2BHK in Bengaluru. He values quality finishes, a good kitchen, and space that impresses clients he occasionally hosts.',
            brief: 'Balance quality and style. Modular kitchen is non-negotiable. Go premium on visible surfaces.',
        },
        {
            id: 'kavya',
            name: 'Kavya Nair',
            emoji: '💎',
            budget: 15.0,
            color: '#6b4226',
            bgColor: '#fdf6ee',
            budgetLabel: '15L',
            tagline: '₹15 Lakh Budget',
            story: 'A creative director who just bought a penthouse in Mumbai. Luxury is the baseline, not the aspiration — she expects bespoke furniture, marble floors, and French windows.',
            brief: 'No compromises. Select the finest finishes in every category. Impress at every glance.',
        }
    ];

    const categories = [
        { id: 'floor', name: 'Flooring', color: '#34495e', svgId: 'v-floor', items: [
            { name: 'Ceramic', cost: 1.0, score: 2, visual: '#bdc3c7' },
            { name: 'Wood', cost: 2.5, score: 6, visual: '#a67c52' },
            { name: 'Marble', cost: 4.5, score: 10, visual: '#f0ece4' }
        ]},
        { id: 'wall', name: 'Wall Finish', color: '#8e44ad', svgId: 'v-wall', items: [
            { name: 'Paint', cost: 0.5, score: 2, visual: '#ecf0f1' },
            { name: 'Wallpaper', cost: 1.5, score: 5, visual: '#f5deb3' },
            { name: 'Stone Clad', cost: 3.0, score: 9, visual: '#9e9e9e' }
        ]},
        { id: 'kitchen', name: 'Kitchen', color: '#c0392b', svgId: null, items: [
            { name: 'Semi', cost: 2.0, score: 3, visual: '#d35400' },
            { name: 'Modular', cost: 4.0, score: 7, visual: '#e67e22' },
            { name: 'Luxury', cost: 6.0, score: 10, visual: '#2c3e50' }
        ]},
        { id: 'ceiling', name: 'Ceiling', color: '#2980b9', svgId: 'v-ceiling', items: [
            { name: 'Plain', cost: 0.3, score: 1, visual: '#ffffff' },
            { name: 'Gypsum', cost: 1.2, score: 5, visual: '#dfe6e9' },
            { name: 'Cove Light', cost: 2.5, score: 8, visual: '#fff9c4' }
        ]},
        { id: 'furniture', name: 'Furniture', color: '#27ae60', svgId: 'v-furniture', items: [
            { name: 'Basic', cost: 1.5, score: 3, visual: '#8d6e63' },
            { name: 'Premium', cost: 3.5, score: 7, visual: '#5d4037' },
            { name: 'Bespoke', cost: 5.5, score: 10, visual: '#3e2723' }
        ]},
        { id: 'window', name: 'Windows', color: '#16a085', svgId: 'v-window', items: [
            { name: 'Alum.', cost: 0.8, score: 3, visual: '#95a5a6' },
            { name: 'UPVC', cost: 1.8, score: 6, visual: '#ffffff' },
            { name: 'French', cost: 3.2, score: 9, visual: '#aecbfa' }
        ]}
    ];

    // ── STATE ────────────────────────────────────────────────────
    let currentClient = clients[1]; // default: Vinod (10L)
    let selections = {};
    let optimalScore = 0;
    const TOWER_HEIGHT = 500; // px total visual height

    // ── INIT ─────────────────────────────────────────────────────
    function init() {
        buildClientBar();
        buildControls();
        selectClient(clients[1]);
    }

    function buildClientBar() {
        const bar = document.getElementById('client-bar');
        clients.forEach(client => {
            const card = document.createElement('div');
            card.className = 'client-card';
            card.id = `client-${client.id}`;
            card.style.setProperty('--client-color', client.color);
            card.innerHTML = `
                <div class="client-avatar">${client.emoji}</div>
                <div class="client-name">${client.name}</div>
                <div class="client-budget-tag" style="background:${client.color}">${client.tagline}</div>
                <div class="client-story">${client.story}</div>
            `;
            card.onclick = () => selectClient(client);
            bar.appendChild(card);
        });
    }

    function buildControls() {
        const ctrl = document.getElementById('controls');
        // remove old category boxes if any
        ctrl.querySelectorAll('.category-box').forEach(e => e.remove());

        categories.forEach(cat => {
            const div = document.createElement('div');
            div.className = 'category-box';
            div.innerHTML = `<span class="cat-name">${cat.name}</span>`;
            const grid = document.createElement('div');
            grid.className = 'option-grid';

            cat.items.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = `opt-btn btn-${cat.id}`;
                btn.id = `btn-${cat.id}-${idx}`;
                btn.innerHTML = `${item.name}<span class="cost-tag">₹${item.cost}L</span>`;
                btn.onclick = () => { selections[cat.id] = idx; update(); };
                grid.appendChild(btn);
            });

            div.appendChild(grid);
            ctrl.appendChild(div);
        });
    }

    function selectClient(client) {
        currentClient = client;

        // Highlight card
        document.querySelectorAll('.client-card').forEach(c => c.classList.remove('active'));
        document.getElementById(`client-${client.id}`).classList.add('active');

        // Update brief box
        const brief = document.getElementById('brief-box');
        brief.style.setProperty('--client-color', client.color);
        brief.style.setProperty('--client-bg', client.bgColor);
        brief.style.borderColor = client.color;
        brief.style.borderLeftColor = client.color;
        brief.innerHTML = `<strong>${client.emoji} Brief from ${client.name}</strong>${client.brief}`;

        // Update active button colour
        document.documentElement.style.setProperty('--active-color', client.color);

        // Recalculate optimal for this budget
        optimalScore = calculateOptimal(client.budget);

        // Default selections = cheapest per category
        categories.forEach(cat => { selections[cat.id] = 0; });

        updateBudgetLine();
        update();
    }

    function updateBudgetLine() {
        const budget = currentClient.budget;
        // Tower represents MAX possible cost: kitchen luxury (6) + marble (4.5) + bespoke furn (5.5) + stone clad wall (3) + cove ceiling (2.5) + french window (3.2) = 24.7L max
        // Scale: bottom=0, top = 24.7L → TOWER_HEIGHT px
        const MAX_COST = 24.7;
        const pxPerLakh = TOWER_HEIGHT / MAX_COST;
        const lineBottom = budget * pxPerLakh;
        const line = document.getElementById('budget-line');
        line.style.bottom = `${lineBottom}px`;
        document.getElementById('budget-label').innerText = `${currentClient.budgetLabel} LIMIT`;
        document.getElementById('tower-header').innerText = `${currentClient.name.split(' ')[0]}'s Budget Tower`;
    }

    function update() {
        let totalCost = 0;
        let totalScore = 0;
        const tower = document.getElementById('tower');
        const MAX_COST = 24.7;
        const pxPerLakh = TOWER_HEIGHT / MAX_COST;

        // Clear blocks
        tower.querySelectorAll('.block').forEach(b => b.remove());

        categories.forEach(cat => {
            const idx = selections[cat.id] ?? 0;
            const item = cat.items[idx];
            totalCost += item.cost;
            totalScore += item.score;

            // Active button
            document.querySelectorAll(`.btn-${cat.id}`).forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${cat.id}-${idx}`)?.classList.add('active');

            // Block
            const block = document.createElement('div');
            block.className = 'block';
            const height = item.cost * pxPerLakh;
            block.style.height = `${height}px`;
            block.style.backgroundColor = cat.color;
            block.innerText = item.name;
            tower.appendChild(block);

            // SVG visualizer
            if (cat.svgId) {
                const el = document.getElementById(cat.svgId);
                if (el) el.setAttribute('fill', item.visual);
            }
        });

        const budget = currentClient.budget;
        document.getElementById('cost-val').innerText = `₹${totalCost.toFixed(1)}L`;
        document.getElementById('score-val').innerText = totalScore;

        const status = document.getElementById('status');
        if (totalCost > budget) {
            status.innerText = `⚠️ Over by ₹${(totalCost - budget).toFixed(1)}L!`;
            status.className = 'status-badge over';
            tower.style.borderColor = 'var(--danger)';
        } else {
            const remaining = (budget - totalCost).toFixed(1);
            status.innerText = `✅ ₹${remaining}L remaining`;
            status.className = 'status-badge ok';
            tower.style.borderColor = 'var(--ink)';

            if (totalScore === optimalScore) {
                launchCelebration();
            }
        }
    }

    function calculateOptimal(budget) {
        function solve(idx, rem) {
            if (idx === categories.length) return 0;
            let best = -Infinity;
            categories[idx].items.forEach(item => {
                if (rem >= item.cost) {
                    const s = item.score + solve(idx + 1, rem - item.cost);
                    if (s > best) best = s;
                }
            });
            return best === -Infinity ? 0 : best;
        }
        return solve(0, budget);
    }

    function autoOptimize() {
        const budget = currentClient.budget;
        let bestScore = -1;
        let bestCombo = {};

        function backtrack(idx, cost, score, combo) {
            if (idx === categories.length) {
                if (score > bestScore) { bestScore = score; bestCombo = { ...combo }; }
                return;
            }
            categories[idx].items.forEach((item, i) => {
                if (cost + item.cost <= budget) {
                    combo[categories[idx].id] = i;
                    backtrack(idx + 1, cost + item.cost, score + item.score, combo);
                }
            });
        }

        backtrack(0, 0, 0, {});
        selections = bestCombo;
        update();
    }

    function launchCelebration() {
        const celeb = document.getElementById('celeb');
        celeb.style.display = 'block';
        document.getElementById('celeb-msg').innerText = `Best design for ${currentClient.name}!`;

        confetti({ particleCount: 180, spread: 80, origin: { y: 0.6 }, colors: ['#c9a84c', '#2d6a4f', '#4a6fa5', '#e07b54'] });
        setTimeout(() => { celeb.style.display = 'none'; }, 3000);
    }

    init();
</script>
</body>
</html>
